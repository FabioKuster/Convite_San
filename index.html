<script>
(function(){
var box=document.getElementById('box'),card=document.getElementById('card');
function medir(){
var w=window.innerWidth||1080,h=window.innerHeight||1350;
var s=Math.min(w/1080,h/1350,1.2);
box.style.width=(1080*s)+'px';box.style.height=(1350*s)+'px';
card.style.transform='scale('+s+')';
card.style.borderRadius=(w<600||s>=0.99)?'0px':'28px';
}
medir();window.addEventListener('resize',medir);
})();
